server:
  port: ${SERVER_PORT:8085}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://204.168.203.32:3306/user_management}
    username: ${DB_USERNAME:landslide}
    password: ${DB_PASSWORD:Landslide123!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      initialization-fail-timeout: 10000
      keepalive-time: 300000
      idle-timeout: 600000
      max-lifetime: 1800000

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: NON_NULL

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.landslide.usermanagement.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret: ${JWT_SECRET:landslide-jwt-secret-key-development-2026}
  expiration-hours: 24

consul:
  host: ${CONSUL_HOST:204.168.203.32}
  port: ${CONSUL_PORT:8500}
  service-host: ${APP_HOST:localhost}
  token: ${CONSUL_TOKEN:}

app:
  env: ${APP_ENV:development}
  subscriptions-api-key: ${SUBSCRIPTIONS_API_KEY:}

services:
  project-management:
    base-url: ${PROJECT_MANAGEMENT_URL:http://204.168.203.32:8084}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: WARN
    com.landslide: INFO
    org.springframework.web: INFO
