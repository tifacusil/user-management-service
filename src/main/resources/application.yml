server:
  port: ${SERVER_PORT:8085}

spring:
  # Lets tests (which skip main()) read .env too; real env vars still win.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://204.168.203.32:3306/user_management}
    username: ${DB_USERNAME:landslide}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      initialization-fail-timeout: 10000
      keepalive-time: 300000
      idle-timeout: 600000
      max-lifetime: 1800000

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: NON_NULL

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.landslide.usermanagement.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: 24

consul:
  host: ${CONSUL_HOST:204.168.203.32}
  port: ${CONSUL_PORT:8500}
  service-host: ${APP_HOST:localhost}
  token: ${CONSUL_TOKEN:}

app:
  env: ${APP_ENV:development}
  subscriptions-api-key: ${SUBSCRIPTIONS_API_KEY:}

services:
  project-management:
    base-url: ${PROJECT_MANAGEMENT_URL:http://204.168.203.32:8084}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    tags:
      application: user-management
    distribution:
      # Sin percentiles-histogram, Micrometer publica http.server.requests como
      # summary (solo _count/_sum, sin _bucket) y el servicio queda fuera del
      # histogram_quantile del dashboard.
      percentiles-histogram:
        http.server.requests: true
      # Mismos cortes que el histograma HTTP de los 4 servicios Go (Sistema B)
      # y del resto de servicios Spring/Flask de Sistema A, para que
      # histogram_quantile sea comparable entre sistemas.
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5000ms

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: WARN
    com.landslide: INFO
    org.springframework.web: INFO
